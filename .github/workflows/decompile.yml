
name: Decompile Granny Plus (IL2CPP)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta de la release donde subiste el ZIP"
        default: "game"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Download Granny-Plus.zip from private release
        run: |
          set -euo pipefail
          mkdir -p work out
          cd work

          gh release download "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Granny-Plus.zip'

          zip="./Granny-Plus.zip"

          [ -f "$zip" ] || {
            echo "::error title=ZIP no encontrado::No se encontró Granny-Plus.zip en la Release"
            exit 1
          }

          mkdir game
          unzip -q "$zip" -d game

          exe="$(find game -maxdepth 4 -name '*.exe' ! -name 'UnityCrashHandler*' | head -n 1)"

          [ -n "$exe" ] || {
            echo "::error title=No encontre el EXE::Revisa el contenido del ZIP"
            exit 1
          }

          echo "GAME_DIR=$(realpath "$(dirname "$exe")")" >> "$GITHUB_ENV"

          echo "Carpeta del juego:"
          realpath "$(dirname "$exe")"
          ls "$(dirname "$exe")" | head -30

      - name: Get latest Cpp2IL
        run: |
          set -euo pipefail
          cd work

          tag="$(gh release list \
            --repo SamboyCoding/Cpp2IL \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')"

          echo "Cpp2IL: $tag"

          mkdir cpp2il

          gh release download "$tag" \
            --repo SamboyCoding/Cpp2IL \
            --pattern '*Linux*' \
            --dir cpp2il

          for z in cpp2il/*.zip; do
            [ -e "$z" ] && unzip -q -o "$z" -d cpp2il
          done

          bin="$(find cpp2il -type f -iname '*cpp2il*' \
            ! -iname '*.zip' \
            ! -iname '*.pdb' \
            ! -iname '*.dll' \
            ! -iname '*arm*' \
            ! -iname '*win*' | head -n 1)"

          [ -n "$bin" ] || {
            echo "::error title=Cpp2IL no encontrado::No se encontró el ejecutable Linux"
            exit 1
          }

          chmod +x "$bin"

          echo "CPP2IL=$(realpath "$bin")" >> "$GITHUB_ENV"

          "$bin" --list-output-formats || true

      - name: Dump game structure and dummy DLLs
        run: |
          set +e
          cd work

          run_logged() {
            name="$1"
            shift

            log="../out/$name.log"

            "$@" 2>&1 | tee "$log" | tail -n 20
            code=${PIPESTATUS[0]}

            if [ "$code" -ne 0 ]; then
              {
                echo "### Fallo: $name (codigo $code)"
                echo '```'
                tail -n 40 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            return "$code"
          }

          run_logged cpp2il-diffable-cs \
            "$CPP2IL" \
            --game-path "$GAME_DIR" \
            --output-as diffable-cs \
            --output-to ../out/diffable-cs

          first=$?

          run_logged cpp2il-dummydll \
            "$CPP2IL" \
            --game-path "$GAME_DIR" \
            --output-as dll_default \
            --output-to ../out/dummydll

          [ "$first" -eq 0 ] || {
            echo "::error title=Cpp2IL fallo::Revisa el Summary"
            exit 1
          }

      - name: Try IL recovery
        continue-on-error: true
        run: |
          set +e
          cd work

          "$CPP2IL" \
            --game-path "$GAME_DIR" \
            --output-as dll_il_recovery \
            --output-to ../out/il-recovery \
            2>&1 | tee ../out/cpp2il-il-recovery.log | tail -n 25

          code=${PIPESTATUS[0]}

          if [ "$code" -ne 0 ]; then
            {
              echo "### IL recovery no funciono (codigo $code), es opcional"
              echo '```'
              tail -n 30 ../out/cpp2il-il-recovery.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$code"

      - name: Decompile Assembly-CSharp with ILSpy
        continue-on-error: true
        run: |
          set -euo pipefail

          dotnet tool install --global ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"

          dll="$(find out/il-recovery out/dummydll \
            -name 'Assembly-CSharp.dll' 2>/dev/null | head -n 1)"

          [ -n "$dll" ] || {
            echo "::error title=Sin Assembly-CSharp.dll::No hay DLL para decompilar"
            exit 1
          }

          echo "Decompilando: $dll"

          ilspycmd -p -o out/csharp "$dll" 2>&1 | tail -n 25

      - name: Pack results
        run: |
          set -euo pipefail

          du -sh out/* || true

          {
            echo "### Resultado"
            echo '```'
            du -sh out/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload decompiled files
        uses: actions/upload-artifact@v4
        with:
          name: granny-decompiled
          path: out
          if-no-files-found: error
          retention-days: 7
