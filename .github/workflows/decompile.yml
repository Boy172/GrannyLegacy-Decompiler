
name: Granny Legacy - Unity Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force input, output, tools

      - name: Extract game ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem input -Filter *.zip | Select-Object -First 1

          if (!$zip) {
            throw "No game ZIP found in input/"
          }

          Expand-Archive $zip.FullName "$env:RUNNER_TEMP/game" -Force

      - name: Locate Unity files
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/game"

          $assembly = Get-ChildItem $root -Recurse -Filter GameAssembly.dll |
            Select-Object -First 1

          $metadata = Get-ChildItem $root -Recurse -Filter global-metadata.dat |
            Select-Object -First 1

          if (!$assembly -or !$metadata) {
            throw "Unity IL2CPP files not found"
          }

          "ASSEMBLY=$($assembly.FullName)" >> $env:GITHUB_ENV
          "METADATA=$($metadata.FullName)" >> $env:GITHUB_ENV

          $gameData = Get-ChildItem $root -Directory -Filter '*_Data' |
            Select-Object -First 1

          if (!$gameData) {
            throw "Unity Data folder not found"
          }

          "GAMEDATA=$($gameData.FullName)" >> $env:GITHUB_ENV

      - name: Download AssetRipper
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            https://api.github.com/repos/AssetRipper/AssetRipper/releases/latest

          $asset = $release.assets |
            Where-Object { $_.name -match 'win.*x64.*\.zip$' } |
            Select-Object -First 1

          if (!$asset) {
            $asset = $release.assets |
              Where-Object { $_.name -match '\.zip$' } |
              Select-Object -First 1
          }

          if (!$asset) {
            throw "AssetRipper Windows archive not found"
          }

          Invoke-WebRequest $asset.browser_download_url `
            -OutFile "$env:RUNNER_TEMP/assetripper.zip"

          Expand-Archive "$env:RUNNER_TEMP/assetripper.zip" `
            "$env:RUNNER_TEMP/assetripper" -Force

      - name: Export Unity project
        shell: pwsh
        run: |
          $tool = Get-ChildItem "$env:RUNNER_TEMP/assetripper" `
            -Recurse -Filter *.exe |
            Where-Object { $_.Name -match 'AssetRipper' } |
            Select-Object -First 1

          if (!$tool) {
            throw "AssetRipper executable not found"
          }

          & $tool.FullName --cli `
            -i "$env:GAMEDATA" `
            -o "$env:GITHUB_WORKSPACE/output/UnityProject" `
            --mode Unity `
            --script-content-level Level0

          if ($LASTEXITCODE -ne 0) {
            throw "AssetRipper failed"
          }

      - name: Download Il2CppDumper
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest

          $asset = $release.assets |
            Where-Object { $_.name -match '\.zip$' } |
            Select-Object -First 1

          if (!$asset) {
            throw "Il2CppDumper archive not found"
          }

          Invoke-WebRequest $asset.browser_download_url `
            -OutFile "$env:RUNNER_TEMP/dumper.zip"

          Expand-Archive "$env:RUNNER_TEMP/dumper.zip" `
            "$env:RUNNER_TEMP/dumper" -Force

      - name: Analyze IL2CPP
        shell: pwsh
        run: |
          $tool = Get-ChildItem "$env:RUNNER_TEMP/dumper" `
            -Recurse -Filter Il2CppDumper.exe |
            Select-Object -First 1

          if (!$tool) {
            throw "Il2CppDumper executable not found"
          }

          & $tool.FullName `
            "$env:ASSEMBLY" `
            "$env:METADATA" `
            "$env:GITHUB_WORKSPACE/output/IL2CPP"

          if ($LASTEXITCODE -ne 0) {
            throw "Il2CppDumper failed"
          }

      - name: Save extracted files
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-Extracted
          path: output/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
