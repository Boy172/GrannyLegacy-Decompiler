
name: Granny Legacy - Unity Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force input, output, tools | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/game" | Out-Null

      - name: Extract game ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath "input" -File -Filter "*.zip" |
            Select-Object -First 1

          if (!$zip) {
            throw "No game ZIP found in input/"
          }

          Write-Host "Extracting: $($zip.Name)"
          Expand-Archive -LiteralPath $zip.FullName `
            -DestinationPath "$env:RUNNER_TEMP/game" -Force

      - name: Locate Unity files
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/game"

          Write-Host "Searching extracted files..."

          $assembly = Get-ChildItem -LiteralPath $root -Recurse -File -Filter "GameAssembly.dll" |
            Select-Object -First 1

          $metadata = Get-ChildItem -LiteralPath $root -Recurse -File -Filter "global-metadata.dat" |
            Select-Object -First 1

          if (!$assembly) {
            throw "GameAssembly.dll not found"
          }

          if (!$metadata) {
            throw "global-metadata.dat not found"
          }

          $gameData = Get-ChildItem -LiteralPath $root -Recurse -Directory |
            Where-Object { $_.Name -like "*_Data" } |
            Select-Object -First 1

          if (!$gameData) {
            $marker = Get-ChildItem -LiteralPath $root -Recurse -File -Filter "globalgamemanagers" |
              Select-Object -First 1

            if ($marker) {
              $gameData = $marker.Directory
            }
          }

          if (!$gameData) {
            Write-Host "Extracted directory structure:"
            Get-ChildItem -LiteralPath $root -Recurse -Depth 4 |
              Select-Object FullName |
              Format-Table -AutoSize

            throw "Unity Data folder not found"
          }

          "ASSEMBLY=$($assembly.FullName)" >> $env:GITHUB_ENV
          "METADATA=$($metadata.FullName)" >> $env:GITHUB_ENV
          "GAMEDATA=$($gameData.FullName)" >> $env:GITHUB_ENV

          Write-Host "GameAssembly: $($assembly.FullName)"
          Write-Host "Metadata: $($metadata.FullName)"
          Write-Host "Game Data: $($gameData.FullName)"

      - name: Download AssetRipper
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/AssetRipper/AssetRipper/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match "win.*x64.*\.zip$" } |
            Select-Object -First 1

          if (!$asset) {
            $asset = $release.assets |
              Where-Object { $_.name -match "\.zip$" } |
              Select-Object -First 1
          }

          if (!$asset) {
            throw "AssetRipper archive not found"
          }

          Invoke-WebRequest -Uri $asset.browser_download_url `
            -OutFile "$env:RUNNER_TEMP/assetripper.zip"

          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/assetripper.zip" `
            -DestinationPath "$env:RUNNER_TEMP/assetripper" -Force

      - name: Export Unity project
        shell: pwsh
        run: |
          $tool = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/assetripper" `
            -Recurse -File -Filter "*.exe" |
            Where-Object { $_.Name -match "AssetRipper" } |
            Select-Object -First 1

          if (!$tool) {
            throw "AssetRipper executable not found"
          }

          New-Item -ItemType Directory -Force `
            "$env:GITHUB_WORKSPACE/output/UnityProject" | Out-Null

          & $tool.FullName --cli `
            -i "$env:GAMEDATA" `
            -o "$env:GITHUB_WORKSPACE/output/UnityProject" `
            --mode Unity `
            --script-content-level Level0

          if ($LASTEXITCODE -ne 0) {
            throw "AssetRipper failed with exit code $LASTEXITCODE"
          }

      - name: Download Il2CppDumper
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match "\.zip$" } |
            Select-Object -First 1

          if (!$asset) {
            throw "Il2CppDumper archive not found"
          }

          Invoke-WebRequest -Uri $asset.browser_download_url `
            -OutFile "$env:RUNNER_TEMP/dumper.zip"

          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/dumper.zip" `
            -DestinationPath "$env:RUNNER_TEMP/dumper" -Force

      - name: Analyze IL2CPP
        shell: pwsh
        run: |
          $tool = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dumper" `
            -Recurse -File -Filter "Il2CppDumper.exe" |
            Select-Object -First 1

          if (!$tool) {
            throw "Il2CppDumper executable not found"
          }

          New-Item -ItemType Directory -Force `
            "$env:GITHUB_WORKSPACE/output/IL2CPP" | Out-Null

          & $tool.FullName `
            "$env:ASSEMBLY" `
            "$env:METADATA" `
            "$env:GITHUB_WORKSPACE/output/IL2CPP"

          if ($LASTEXITCODE -ne 0) {
            throw "Il2CppDumper failed with exit code $LASTEXITCODE"
          }

      - name: Save extracted files
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-Extracted
          path: output/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
