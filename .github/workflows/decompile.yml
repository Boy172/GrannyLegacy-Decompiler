
name: Granny Legacy - Unity Extraction

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path input, output, tools | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/game" | Out-Null

      - name: Extract game ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE/input" -Filter "*.zip" -File |
            Select-Object -First 1

          if (-not $zip) {
            throw "No se encontró ningún ZIP en input."
          }

          Write-Host "ZIP: $($zip.FullName)"
          Write-Host "Tamaño: $($zip.Length) bytes"

          Expand-Archive `
            -LiteralPath $zip.FullName `
            -DestinationPath "$env:RUNNER_TEMP/game" `
            -Force

          Write-Host "Extracción del ZIP completada."

      - name: Locate Unity files
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/game"

          $assembly = Get-ChildItem $root `
            -Filter "GameAssembly.dll" `
            -File -Recurse |
            Select-Object -First 1

          $metadata = Get-ChildItem $root `
            -Filter "global-metadata.dat" `
            -File -Recurse |
            Select-Object -First 1

          $dataFolder = Get-ChildItem $root -Directory -Recurse |
            Where-Object { $_.Name -like "*_Data" } |
            Select-Object -First 1

          if (-not $dataFolder) {
            $globalManagers = Get-ChildItem $root `
              -Filter "globalgamemanagers" `
              -File -Recurse |
              Select-Object -First 1

            if ($globalManagers) {
              $dataFolder = $globalManagers.Directory
            }
          }

          if (-not $assembly) {
            throw "No se encontró GameAssembly.dll."
          }

          if (-not $metadata) {
            throw "No se encontró global-metadata.dat."
          }

          if (-not $dataFolder) {
            throw "No se encontró la carpeta Unity *_Data."
          }

          "ASSEMBLY=$($assembly.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "METADATA=$($metadata.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "GAMEDATA=$($dataFolder.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "GameAssembly: $($assembly.FullName)"
          Write-Host "Metadata: $($metadata.FullName)"
          Write-Host "Unity Data: $($dataFolder.FullName)"

      - name: Download AssetRipper
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/AssetRipper_win_x64.zip"
          $destination = "$env:RUNNER_TEMP/AssetRipper"

          $url = "https://github.com/AssetRipper/AssetRipper/releases/latest/download/AssetRipper_win_x64.zip"

          Write-Host "Descargando AssetRipper Windows x64..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "No se descargó el ZIP de AssetRipper."
          }

          $size = (Get-Item $zip).Length

          if ($size -lt 1000000) {
            throw "El ZIP parece incompleto. Tamaño: $size bytes"
          }

          Write-Host "ZIP descargado: $size bytes"

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $destination `
            -Force

          $tool = Get-ChildItem $destination `
            -Filter "AssetRipper.GUI.Free.exe" `
            -File -Recurse |
            Select-Object -First 1

          if (-not $tool) {
            throw "No se encontró AssetRipper.GUI.Free.exe."
          }

          "ASSETRIPPER=$($tool.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Ejecutable: $($tool.FullName)"

      - name: Verify AssetRipper
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:ASSETRIPPER)) {
            throw "El ejecutable de AssetRipper no existe."
          }

          $file = Get-Item -LiteralPath $env:ASSETRIPPER

          Write-Host "Ejecutable: $($file.FullName)"
          Write-Host "Tamaño: $($file.Length) bytes"
          Write-Host "Sistema: $env:RUNNER_OS"
          Write-Host "Arquitectura: $env:PROCESSOR_ARCHITECTURE"

          if ($file.Length -lt 1000000) {
            throw "El ejecutable parece incompleto."
          }

      - name: Run AssetRipper
        shell: pwsh
        timeout-minutes: 120
        run: |
          $output = "$env:GITHUB_WORKSPACE/output/UnityProject"
          $port = 17891
          $baseUrl = "http://127.0.0.1:$port"
          $log = "$env:RUNNER_TEMP/AssetRipper.log"

          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Write-Host "Iniciando AssetRipper..."
          Write-Host "Entrada: $env:GAMEDATA"
          Write-Host "Salida: $output"

          $process = Start-Process `
            -FilePath "$env:ASSETRIPPER" `
            -ArgumentList @(
              "--headless",
              "--port",
              "$port",
              "--log-path",
              "`"$log`""
            ) `
            -WorkingDirectory (Split-Path "$env:ASSETRIPPER") `
            -PassThru

          Write-Host "PID: $($process.Id)"

          $ready = $false

          Write-Host "Esperando al servidor..."

          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2

            $process.Refresh()

            if ($process.HasExited) {
              if (Test-Path $log) {
                Get-Content $log -Tail 80
              }

              throw "AssetRipper se cerró durante el inicio."
            }

            try {
              $response = Invoke-WebRequest `
                -Uri "$baseUrl/" `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            }
            catch {
              Write-Host "Esperando respuesta..."
            }
          }

          if (-not $ready) {
            if (Test-Path $log) {
              Get-Content $log -Tail 80
            }

            throw "AssetRipper no inició el servidor."
          }

          Write-Host "Servidor iniciado correctamente."

          Write-Host "Cargando archivos del juego..."

          $loadResponse = Invoke-WebRequest `
            -Uri "$baseUrl/LoadFolder" `
            -Method POST `
            -ContentType "application/x-www-form-urlencoded" `
            -Body @{
              Path = $env:GAMEDATA
            } `
            -TimeoutSec 3600

          Write-Host "Carga completada. HTTP: $($loadResponse.StatusCode)"

          Write-Host "Exportando proyecto Unity..."

          $exportResponse = Invoke-WebRequest `
            -Uri "$baseUrl/Export/UnityProject" `
            -Method POST `
            -ContentType "application/x-www-form-urlencoded" `
            -Body @{
              Path = $output
            } `
            -TimeoutSec 3600

          Write-Host "Exportación completada. HTTP: $($exportResponse.StatusCode)"

          $files = @(Get-ChildItem $output -File -Recurse)

          if ($files.Count -eq 0) {
            throw "AssetRipper no generó archivos."
          }

          Write-Host "Archivos exportados: $($files.Count)"

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - name: Download Il2CppDumper
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -like "*.zip" } |
            Select-Object -First 1

          if (-not $asset) {
            throw "No se encontró el ZIP de Il2CppDumper."
          }

          Write-Host "Descargando: $($asset.name)"

          $zip = "$env:RUNNER_TEMP/Il2CppDumper.zip"
          $destination = "$env:RUNNER_TEMP/Il2CppDumper"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $zip

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $destination `
            -Force

          $tool = Get-ChildItem $destination `
            -Filter "Il2CppDumper.exe" `
            -File -Recurse |
            Select-Object -First 1

          if (-not $tool) {
            throw "No se encontró Il2CppDumper.exe."
          }

          "IL2CPPDUMPER=$($tool.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Il2CppDumper: $($tool.FullName)"

      - name: Install .NET 6 Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
          dotnet-quality: 'ga'

      - name: Verify .NET
        shell: pwsh
        run: |
          dotnet --list-runtimes

      - name: Analyze IL2CPP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE/output/IL2CPP"

          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Write-Host "Iniciando Il2CppDumper..."
          Write-Host "Assembly: $env:ASSEMBLY"
          Write-Host "Metadata: $env:METADATA"

          $arguments = @(
            "`"$env:ASSEMBLY`"",
            "`"$env:METADATA`"",
            "`"$output`""
          )

          $process = Start-Process `
            -FilePath "$env:IL2CPPDUMPER" `
            -ArgumentList $arguments `
            -WorkingDirectory (Split-Path "$env:IL2CPPDUMPER") `
            -NoNewWindow `
            -PassThru `
            -Wait

          Write-Host "Código de salida: $($process.ExitCode)"

          $files = @(Get-ChildItem $output -File -Recurse)

          if ($files.Count -eq 0) {
            throw "Il2CppDumper no generó archivos."
          }

          Write-Host "Il2CppDumper generó $($files.Count) archivos."

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $diagnostics = "$env:GITHUB_WORKSPACE/output/Diagnostics"

          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null

          $log = "$env:RUNNER_TEMP/AssetRipper.log"

          if (Test-Path $log) {
            Copy-Item $log "$diagnostics/AssetRipper.log" -Force
            Write-Host "Log de AssetRipper guardado."
          }

      - name: Show generated files
        if: always()
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE/output"

          if (Test-Path $output) {
            $files = @(Get-ChildItem $output -File -Recurse)

            Write-Host "Total de archivos: $($files.Count)"

            $files |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }

      - name: Upload extraction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrannyLegacy-Decompiled
          path: output/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
