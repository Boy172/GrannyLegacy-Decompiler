
name: Decompile Granny Plus (IL2CPP)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Granny Plus from input
        run: |
          set -euo pipefail

          mkdir -p work out

          ZIP="$GITHUB_WORKSPACE/input/Granny-Plus.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error title=ZIP no encontrado::No existe input/Granny-Plus.zip"
            echo "Contenido de input:"
            ls -lah "$GITHUB_WORKSPACE/input" || true
            exit 1
          fi

          echo "Archivo encontrado:"
          ls -lh "$ZIP"

          mkdir -p work/game
          unzip -q "$ZIP" -d work/game

          exe="$(find work/game -maxdepth 5 -name '*.exe' ! -name 'UnityCrashHandler*' | head -n 1)"

          if [ -z "$exe" ]; then
            echo "::error title=EXE no encontrado::Revisa el contenido del ZIP"
            exit 1
          fi

          GAME_DIR="$(realpath "$(dirname "$exe")")"

          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

          echo "Carpeta del juego:"
          echo "$GAME_DIR"
          ls "$GAME_DIR" | head -30

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get latest Cpp2IL
        run: |
          set -euo pipefail

          cd work

          tag="$(gh release list \
            --repo SamboyCoding/Cpp2IL \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')"

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error title=Cpp2IL no disponible::No se pudo obtener la versión"
            exit 1
          fi

          echo "Cpp2IL: $tag"

          mkdir -p cpp2il

          gh release download "$tag" \
            --repo SamboyCoding/Cpp2IL \
            --pattern '*Linux*' \
            --dir cpp2il

          for z in cpp2il/*.zip; do
            [ -e "$z" ] && unzip -q -o "$z" -d cpp2il
          done

          bin="$(find cpp2il -type f -iname '*cpp2il*' \
            ! -iname '*.zip' \
            ! -iname '*.pdb' \
            ! -iname '*.dll' \
            ! -iname '*arm*' \
            ! -iname '*win*' | head -n 1)"

          if [ -z "$bin" ]; then
            echo "::error title=Cpp2IL no encontrado::No se encontró el ejecutable Linux"
            find cpp2il -maxdepth 3 -type f | head -50
            exit 1
          fi

          chmod +x "$bin"

          echo "CPP2IL=$(realpath "$bin")" >> "$GITHUB_ENV"

          "$bin" --list-output-formats || true

      - name: Dump game structure and dummy DLLs
        run: |
          set +e

          cd work

          run_logged() {
            name="$1"
            shift

            log="../out/$name.log"

            "$@" 2>&1 | tee "$log" | tail -n 20
            code=${PIPESTATUS[0]}

            if [ "$code" -ne 0 ]; then
              {
                echo "### Fallo: $name (codigo $code)"
                echo '```'
                tail -n 40 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            return "$code"
          }

          run_logged cpp2il-diffable-cs \
            "$CPP2IL" \
            --game-path "$GAME_DIR" \
            --output-as diffable-cs \
            --output-to ../out/diffable-cs

          first=$?

          run_logged cpp2il-dummydll \
            "$CPP2IL" \
            --game-path "$GAME_DIR" \
            --output-as dll_default \
            --output-to ../out/dummydll

          second=$?

          if [ "$first" -ne 0 ] && [ "$second" -ne 0 ]; then
            echo "::error title=Cpp2IL fallo::Fallaron los dos formatos principales"
            exit 1
          fi

      - name: Try IL recovery
        continue-on-error: true
        run: |
          set +e

          cd work

          "$CPP2IL" \
            --game-path "$GAME_DIR" \
            --output-as dll_il_recovery \
            --output-to ../out/il-recovery \
            2>&1 | tee ../out/cpp2il-il-recovery.log | tail -n 25

          code=${PIPESTATUS[0]}

          if [ "$code" -ne 0 ]; then
            {
              echo "### IL recovery no funciono (codigo $code), es opcional"
              echo '```'
              tail -n 30 ../out/cpp2il-il-recovery.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$code"

      - name: Decompile Assembly-CSharp with ILSpy
        continue-on-error: true
        run: |
          set -euo pipefail

          dotnet tool install --global ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"

          dll="$(find out/il-recovery out/dummydll \
            -name 'Assembly-CSharp.dll' 2>/dev/null | head -n 1)"

          if [ -z "$dll" ]; then
            echo "::error title=Sin Assembly-CSharp.dll::No hay DLL para decompilar"
            exit 1
          fi

          echo "Decompilando: $dll"

          ilspycmd -p -o out/csharp "$dll" 2>&1 | tail -n 25

      - name: Generate summary
        if: always()
        run: |
          echo "## Granny Plus - Resultado del análisis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Archivo de entrada: input/Granny-Plus.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d out ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            du -sh out/* 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload decompiled files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: granny-decompiled
          path: out
          if-no-files-found: warn
          retention-days: 7
