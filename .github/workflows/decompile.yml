
name: Granny Legacy - Unity Extraction

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path input, output, tools | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/game" | Out-Null

      - name: Extract game ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE/input" -Filter "*.zip" -File | Select-Object -First 1

          if (-not $zip) {
            throw "No se encontró ningún ZIP en input."
          }

          Write-Host "Extrayendo: $($zip.FullName)"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath "$env:RUNNER_TEMP/game" -Force

      - name: Locate Unity files
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/game"

          $assembly = Get-ChildItem $root -Filter "GameAssembly.dll" -File -Recurse | Select-Object -First 1
          $metadata = Get-ChildItem $root -Filter "global-metadata.dat" -File -Recurse | Select-Object -First 1
          $dataFolder = Get-ChildItem $root -Directory -Recurse |
            Where-Object { $_.Name -like "*_Data" } |
            Select-Object -First 1

          if (-not $dataFolder) {
            $globalManagers = Get-ChildItem $root -Filter "globalgamemanagers" -File -Recurse | Select-Object -First 1

            if ($globalManagers) {
              $dataFolder = $globalManagers.Directory
            }
          }

          if (-not $assembly) {
            throw "No se encontró GameAssembly.dll."
          }

          if (-not $metadata) {
            throw "No se encontró global-metadata.dat."
          }

          if (-not $dataFolder) {
            throw "No se encontró la carpeta Unity *_Data."
          }

          "ASSEMBLY=$($assembly.FullName)" | Out-File $env:GITHUB_ENV -Append
          "METADATA=$($metadata.FullName)" | Out-File $env:GITHUB_ENV -Append
          "GAMEDATA=$($dataFolder.FullName)" | Out-File $env:GITHUB_ENV -Append

          Write-Host "GameAssembly: $($assembly.FullName)"
          Write-Host "Metadata: $($metadata.FullName)"
          Write-Host "Unity Data: $($dataFolder.FullName)"

      - name: Download AssetRipper
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/AssetRipper/AssetRipper/releases/latest"

          Write-Host "AssetRipper version: $($release.tag_name)"

          $assets = $release.assets

          $assets | ForEach-Object {
            Write-Host "Available: $($_.name)"
          }

          $asset = $assets |
            Where-Object {
              $_.name -match '(?i)(windows|win).*(x64|win64|64).*(\.zip)$'
            } |
            Select-Object -First 1

          if (-not $asset) {
            $asset = $assets |
              Where-Object {
                $_.name -match '(?i)(windows|win).*(\.zip)$'
              } |
              Select-Object -First 1
          }

          if (-not $asset) {
            throw "No se encontró un paquete ZIP de Windows. Revisa los nombres Available del registro."
          }

          Write-Host "Descargando: $($asset.name)"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile "$env:RUNNER_TEMP/AssetRipper.zip"

          Expand-Archive `
            -LiteralPath "$env:RUNNER_TEMP/AssetRipper.zip" `
            -DestinationPath "$env:RUNNER_TEMP/AssetRipper" `
            -Force

          $tools = Get-ChildItem `
            "$env:RUNNER_TEMP/AssetRipper" `
            -Filter "*.exe" `
            -File `
            -Recurse

          $tools | ForEach-Object {
            Write-Host "Executable: $($_.FullName)"
          }

          $tool = $tools |
            Where-Object {
              $_.Name -eq "AssetRipper.GUI.Free.exe"
            } |
            Select-Object -First 1

          if (-not $tool) {
            throw "No se encontró AssetRipper.GUI.Free.exe."
          }

          $env:ASSETRIPPER = $tool.FullName
          "ASSETRIPPER=$($tool.FullName)" | Out-File $env:GITHUB_ENV -Append

          Write-Host "AssetRipper seleccionado: $($tool.FullName)"

      - name: Verify AssetRipper executable
        shell: pwsh
        run: |
          $tool = $env:ASSETRIPPER

          if (-not (Test-Path -LiteralPath $tool)) {
            throw "El ejecutable de AssetRipper no existe."
          }

          $file = Get-Item -LiteralPath $tool

          Write-Host "Ejecutable: $($file.FullName)"
          Write-Host "Tamaño: $($file.Length) bytes"

          if ($file.Length -lt 100000) {
            throw "El ejecutable parece incompleto."
          }

      - name: Run AssetRipper
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE/output/UnityProject"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Write-Host "Iniciando AssetRipper..."

          & "$env:ASSETRIPPER" --cli `
            -i "$env:GAMEDATA" `
            -o "$output" `
            --mode Unity `
            --script-content-level Level0

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            throw "AssetRipper terminó con código $exitCode."
          }

          $files = Get-ChildItem $output -File -Recurse

          if (-not $files) {
            throw "AssetRipper no generó archivos."
          }

          Write-Host "AssetRipper generó $($files.Count) archivos."

      - name: Download Il2CppDumper
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -like "*.zip" } |
            Select-Object -First 1

          if (-not $asset) {
            throw "No se encontró el ZIP de Il2CppDumper."
          }

          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP/Il2CppDumper.zip"

          Expand-Archive `
            "$env:RUNNER_TEMP/Il2CppDumper.zip" `
            "$env:RUNNER_TEMP/Il2CppDumper" `
            -Force

          $tool = Get-ChildItem `
            "$env:RUNNER_TEMP/Il2CppDumper" `
            -Filter "Il2CppDumper.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $tool) {
            throw "No se encontró Il2CppDumper.exe."
          }

          "IL2CPPDUMPER=$($tool.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Install .NET 6 Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
          dotnet-quality: 'ga'

      - name: Verify .NET
        shell: pwsh
        run: |
          dotnet --list-runtimes

      - name: Analyze IL2CPP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE/output/IL2CPP"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Write-Host "Iniciando Il2CppDumper..."

          $arguments = @(
            "`"$env:ASSEMBLY`"",
            "`"$env:METADATA`"",
            "`"$output`""
          )

          $process = Start-Process `
            -FilePath "$env:IL2CPPDUMPER" `
            -ArgumentList $arguments `
            -WorkingDirectory (Split-Path "$env:IL2CPPDUMPER") `
            -NoNewWindow `
            -PassThru `
            -Wait

          Write-Host "Código de salida: $($process.ExitCode)"

          $files = Get-ChildItem $output -File -Recurse

          if ($files.Count -gt 0) {
            Write-Host "Il2CppDumper generó $($files.Count) archivos."
          }
          else {
            throw "Il2CppDumper no generó archivos."
          }

      - name: Show generated files
        if: always()
        shell: pwsh
        run: |
          Write-Host "Archivos generados:"

          if (Test-Path "$env:GITHUB_WORKSPACE/output") {
            Get-ChildItem "$env:GITHUB_WORKSPACE/output" -File -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }

      - name: Upload extraction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrannyLegacy-Decompiled
          path: output/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
