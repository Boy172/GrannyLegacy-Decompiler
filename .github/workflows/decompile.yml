
name: Granny Plus - Complete Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  cpp2il-ilspy:
    name: Cpp2IL and C# Recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract game
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/input/Granny-Plus.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::No existe input/Granny-Plus.zip"
            exit 1
          fi

          mkdir -p work/game out/cpp2il out/csharp out/logs

          echo "Tamaño del ZIP:"
          ls -lh "$ZIP"

          unzip -q "$ZIP" -d work/game

          EXE="$(find work/game -type f -iname '*.exe' \
            ! -iname 'UnityCrashHandler*' | head -n 1)"

          METADATA="$(find work/game -type f \
            -name global-metadata.dat | head -n 1)"

          GAMEASSEMBLY="$(find work/game -type f \
            -name GameAssembly.dll | head -n 1)"

          if [ -z "$EXE" ]; then
            echo "::error::No se encontró el EXE del juego"
            exit 1
          fi

          if [ -z "$METADATA" ]; then
            echo "::error::No se encontró global-metadata.dat"
            exit 1
          fi

          if [ -z "$GAMEASSEMBLY" ]; then
            echo "::error::No se encontró GameAssembly.dll"
            exit 1
          fi

          GAME_DIR="$(dirname "$EXE")"

          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

          echo "Ejecutable: $EXE"
          echo "Metadata: $METADATA"
          echo "GameAssembly: $GAMEASSEMBLY"

      - name: Download Cpp2IL development build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools/cpp2il

          URL="https://nightly.link/SamboyCoding/Cpp2IL/workflows/dotnet-core/development/Cpp2IL-net9-linux-x64.zip"

          echo "Descargando Cpp2IL Linux x64..."

          curl -fL --retry 3 --retry-delay 5 \
            "$URL" \
            -o tools/cpp2il/cpp2il.zip

          if ! unzip -tq tools/cpp2il/cpp2il.zip; then
            echo "::error::El ZIP de Cpp2IL no es válido"
            exit 1
          fi

          unzip -q -o tools/cpp2il/cpp2il.zip \
            -d tools/cpp2il/app

          BIN="$(find tools/cpp2il/app -type f \
            -name 'Cpp2IL' | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "::error::No se encontró el ejecutable Cpp2IL"
            find tools/cpp2il/app -maxdepth 4 -type f
            exit 1
          fi

          chmod +x "$BIN"

          echo "CPP2IL=$GITHUB_WORKSPACE/$BIN" >> "$GITHUB_ENV"

          echo "Cpp2IL descargado:"
          ls -lh "$BIN"

      - name: Check Cpp2IL formats
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/logs

          "$CPP2IL" --list-output-formats \
            2>&1 | tee out/logs/cpp2il-formats.txt

      - name: Recover IL2CPP assemblies
        shell: bash
        run: |
          set +e

          mkdir -p out/cpp2il out/logs

          run_format() {
            FORMAT="$1"
            DEST="$2"
            LOG="out/logs/cpp2il-$FORMAT.log"

            mkdir -p "$DEST"

            echo ""
            echo "======================================"
            echo "Formato: $FORMAT"
            echo "======================================"

            "$CPP2IL" \
              --game-path "$GAME_DIR" \
              --output-as "$FORMAT" \
              --output-to "$GITHUB_WORKSPACE/$DEST" \
              2>&1 | tee "$LOG"

            CODE=${PIPESTATUS[0]}

            echo "Código de salida: $CODE"

            if [ "$CODE" -ne 0 ]; then
              echo "No se pudo completar $FORMAT."
            fi

            return 0
          }

          run_format dll_il_recovery \
            out/cpp2il/il-recovery

          run_format diffable-cs \
            out/cpp2il/diffable-cs

          echo "Cpp2IL terminó sus intentos."

      - name: Install .NET for ILSpy
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Install ILSpy command line
        shell: bash
        run: |
          dotnet tool install --global ilspycmd

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Decompile recovered DLL files
        shell: bash
        continue-on-error: true
        run: |
          set +e

          mkdir -p out/csharp out/logs

          COUNT=0

          while IFS= read -r -d '' DLL; do
            COUNT=$((COUNT + 1))

            NAME="$(basename "$DLL" .dll)"
            DEST="out/csharp/$NAME"

            mkdir -p "$DEST"

            echo "Decompilando: $DLL"

            ilspycmd -p \
              -o "$DEST" \
              "$DLL" \
              > "out/logs/ilspy-$NAME.log" 2>&1

            if [ $? -ne 0 ]; then
              echo "No se pudo decompilar: $NAME"
            fi

          done < <(find out/cpp2il -type f \
            -iname '*.dll' -print0)

          echo "DLL procesadas: $COUNT"

      - name: Generate Cpp2IL report
        if: always()
        shell: bash
        run: |
          set +e

          if [ -e out ] && [ ! -d out ]; then
            mv out out-file-backup
          fi

          mkdir -p out/cpp2il out/csharp out/logs

          {
            echo "GRANNY PLUS - CPP2IL REPORT"
            echo "Fecha: $(date -u)"
            echo ""
            echo "Archivos recuperados:"
            find out/cpp2il out/csharp \
              -type f 2>/dev/null | sort
            echo ""
            echo "Tamaños:"
            du -sh out/cpp2il out/csharp 2>/dev/null
          } > out/cpp2il-report.txt

      - name: Upload Cpp2IL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: granny-cpp2il-csharp
          path: out
          if-no-files-found: warn
          retention-days: 7


  ghidra-analysis:
    name: Ghidra Native Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract GameAssembly
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/input/Granny-Plus.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::No existe input/Granny-Plus.zip"
            exit 1
          fi

          mkdir -p work/game out/ghidra

          unzip -q "$ZIP" -d work/game

          DLL="$(find work/game -type f \
            -name GameAssembly.dll | head -n 1)"

          if [ -z "$DLL" ]; then
            echo "::error::GameAssembly.dll no encontrado"
            exit 1
          fi

          echo "GAMEASSEMBLY=$(realpath "$DLL")" >> "$GITHUB_ENV"

          ls -lh "$DLL"

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download Ghidra
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p tools/ghidra

          TAG="$(gh release view \
            --repo NationalSecurityAgency/ghidra \
            --json tagName \
            --jq '.tagName')"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No se encontró Ghidra"
            exit 1
          fi

          echo "Versión: $TAG"

          ASSET="$(gh release view "$TAG" \
            --repo NationalSecurityAgency/ghidra \
            --json assets \
            --jq '.assets[].name' |
            grep -Ei '^ghidra_.*\.zip$' |
            head -n 1)"

          if [ -z "$ASSET" ]; then
            echo "::error::No se encontró el ZIP oficial de Ghidra"
            exit 1
          fi

          gh release download "$TAG" \
            --repo NationalSecurityAgency/ghidra \
            --pattern "$ASSET" \
            --dir tools/ghidra

          unzip -q tools/ghidra/*.zip -d tools/ghidra

          HEADLESS="$(find tools/ghidra -type f \
            -path '*/support/analyzeHeadless' | head -n 1)"

          if [ -z "$HEADLESS" ]; then
            echo "::error::No se encontró analyzeHeadless"
            exit 1
          fi

          chmod +x "$HEADLESS"

          GHIDRA_HOME="$(dirname "$(dirname "$HEADLESS")")"

          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

          echo "Ghidra instalado en $GHIDRA_HOME"

      - name: Create Ghidra decompiler script
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ghidra-scripts out/ghidra

          cat > ghidra-scripts/ExportDecompiledFunctions.java <<'JAVA'
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.FunctionIterator;
          import java.io.BufferedWriter;
          import java.io.FileWriter;
          import java.io.PrintWriter;

          public class ExportDecompiledFunctions extends GhidraScript {

              @Override
              protected void run() throws Exception {

                  String[] args = getScriptArgs();

                  if (args.length < 1) {
                      printerr("Falta la ruta del archivo de salida");
                      return;
                  }

                  PrintWriter output = new PrintWriter(
                      new BufferedWriter(
                          new FileWriter(args[0])
                      )
                  );

                  DecompInterface decompiler = new DecompInterface();

                  decompiler.toggleCCode(true);
                  decompiler.toggleSyntaxTree(false);
                  decompiler.setSimplificationStyle("decompile");

                  if (!decompiler.openProgram(currentProgram)) {
                      output.println("No se pudo abrir el programa");
                      output.close();
                      return;
                  }

                  FunctionIterator functions =
                      currentProgram.getFunctionManager().getFunctions(true);

                  int total = 0;
                  int successful = 0;
                  int failed = 0;

                  output.println("GRANNY PLUS - GAMEASSEMBLY");
                  output.println("Programa: " + currentProgram.getName());
                  output.flush();

                  while (functions.hasNext() && !monitor.isCancelled()) {

                      Function function = functions.next();

                      if (function.isExternal() || function.isThunk()) {
                          continue;
                      }

                      total++;

                      monitor.setMessage(
                          "Decompilando: " + function.getName()
                      );

                      output.println();
                      output.println("========================================");
                      output.println("FUNCTION: " + function.getName());
                      output.println("ADDRESS: " + function.getEntryPoint());
                      output.println("========================================");

                      try {

                          DecompileResults result =
                              decompiler.decompileFunction(
                                  function,
                                  45,
                                  monitor
                              );

                          if (result.decompileCompleted()
                              && result.getDecompiledFunction() != null) {

                              output.println(
                                  result.getDecompiledFunction().getC()
                              );

                              successful++;

                          } else {

                              output.println(
                                  "// FAILED: " + result.getErrorMessage()
                              );

                              failed++;
                          }

                      } catch (Exception exception) {

                          output.println(
                              "// ERROR: " + exception.getMessage()
                          );

                          failed++;
                      }

                      if (total % 100 == 0) {
                          output.flush();
                      }
                  }

                  output.println();
                  output.println("TOTAL: " + total);
                  output.println("SUCCESSFUL: " + successful);
                  output.println("FAILED: " + failed);

                  output.close();
                  decompiler.dispose();

                  println("Funciones procesadas: " + total);
                  println("Correctas: " + successful);
                  println("Fallidas: " + failed);
              }
          }
          JAVA

      - name: Analyze GameAssembly
        shell: bash
        run: |
          set -o pipefail

          mkdir -p out/ghidra projects

          "$GHIDRA_HOME/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/projects" \
            GrannyPlus \
            -import "$GAMEASSEMBLY" \
            -overwrite \
            -scriptPath "$GITHUB_WORKSPACE/ghidra-scripts" \
            -postScript ExportDecompiledFunctions.java \
              "$GITHUB_WORKSPACE/out/ghidra/GameAssembly.c" \
            -analysisTimeoutPerFile 14400 \
            -max-cpu 2 \
            2>&1 | tee out/ghidra/ghidra-analysis.log

      - name: Generate Ghidra report
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p out/ghidra

          {
            echo "GRANNY PLUS - GHIDRA REPORT"
            echo "Fecha: $(date -u)"
            echo ""
            echo "Archivos:"
            find out/ghidra -type f \
              -printf '%p %s bytes\n' 2>/dev/null
            echo ""
            du -sh out/ghidra 2>/dev/null
          } > out/ghidra/report.txt

      - name: Upload Ghidra results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: granny-ghidra-native-analysis
          path: out/ghidra
          if-no-files-found: warn
          retention-days: 7


  unity-assets:
    name: AssetRipper Unity Recovery
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract Granny Plus
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE/input/Granny-Plus.zip"

          if (!(Test-Path -LiteralPath $zip)) {
            throw "No existe input/Granny-Plus.zip"
          }

          New-Item -ItemType Directory -Force `
            -Path "work/game" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "output" | Out-Null

          Expand-Archive -LiteralPath $zip `
            -DestinationPath "work/game" -Force

          $exe = Get-ChildItem "work/game" -Recurse -File |
            Where-Object {
              $_.Extension -eq ".exe" -and
              $_.Name -notlike "UnityCrashHandler*"
            } |
            Select-Object -First 1

          if (!$exe) {
            throw "No se encontró el EXE del juego"
          }

          $data = Get-ChildItem $exe.Directory.FullName -Directory |
            Where-Object {
              $_.Name -like "*_Data"
            } |
            Select-Object -First 1

          if (!$data) {
            throw "No se encontró la carpeta *_Data"
          }

          "GAME_DATA=$($data.FullName)" >> $env:GITHUB_ENV

          Write-Host "EXE: $($exe.FullName)"
          Write-Host "Unity Data: $($data.FullName)"

      - name: Download AssetRipper
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view `
            --repo AssetRipper/AssetRipper `
            --json tagName,assets | ConvertFrom-Json

          $tag = $release.tagName

          if (!$tag) {
            throw "No se encontró una release de AssetRipper"
          }

          Write-Host "AssetRipper: $tag"

          $asset = $release.assets |
            Where-Object {
              $_.name -match "^AssetRipper_win_x64\.zip$"
            } |
            Select-Object -First 1

          if (!$asset) {
            $asset = $release.assets |
              Where-Object {
                $_.name -match "win.*x64.*\.zip$"
              } |
              Select-Object -First 1
          }

          if (!$asset) {
            throw "No se encontró el paquete Windows x64"
          }

          New-Item -ItemType Directory -Force `
            -Path "tools" | Out-Null

          gh release download $tag `
            --repo AssetRipper/AssetRipper `
            --pattern $asset.name `
            --dir tools

          $archive = Get-ChildItem tools -Filter "*.zip" |
            Select-Object -First 1

          if (!$archive) {
            throw "No se descargó el ZIP de AssetRipper"
          }

          Expand-Archive -LiteralPath $archive.FullName `
            -DestinationPath "tools/AssetRipper" -Force

          $exe = Get-ChildItem "tools/AssetRipper" -Recurse -File |
            Where-Object {
              $_.Name -eq "AssetRipper.GUI.Free.exe"
            } |
            Select-Object -First 1

          if (!$exe) {
            throw "No se encontró AssetRipper.GUI.Free.exe"
          }

          "ASSETRIPPER=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Export Unity project
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "$env:GITHUB_WORKSPACE\assetripper.log"

          $process = Start-Process `
            -FilePath $env:ASSETRIPPER `
            -ArgumentList "--headless --port 17891 --log-path `"$log`"" `
            -PassThru

          try {
            $ready = $false

            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2

              try {
                Invoke-WebRequest `
                  -Uri "http://127.0.0.1:17891/" `
                  -TimeoutSec 3 | Out-Null

                $ready = $true
                break
              }
              catch {}
            }

            if (!$ready) {
              throw "AssetRipper no inició su servidor"
            }

            Write-Host "Cargando archivos Unity..."

            $load = Invoke-WebRequest `
              -Uri "http://127.0.0.1:17891/LoadFolder" `
              -Method POST `
              -ContentType "application/x-www-form-urlencoded" `
              -Body @{
                Path = $env:GAME_DATA
              } `
              -TimeoutSec 600

            Write-Host $load.Content

            New-Item -ItemType Directory -Force `
              -Path "output/UnityProject" | Out-Null

            Write-Host "Exportando proyecto Unity..."

            $export = Invoke-WebRequest `
              -Uri "http://127.0.0.1:17891/Export/UnityProject" `
              -Method POST `
              -ContentType "application/x-www-form-urlencoded" `
              -Body @{
                Path = "$env:GITHUB_WORKSPACE\output\UnityProject"
              } `
              -TimeoutSec 3600

            Write-Host $export.Content
          }
          finally {
            if ($process -and !$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Save AssetRipper logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "output" | Out-Null

          if (Test-Path "assetripper.log") {
            Copy-Item "assetripper.log" `
              "output/assetripper.log" -Force
          }

          Get-ChildItem "output" -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload Unity project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: granny-unity-recovered
          path: output
          if-no-files-found: warn
          retention-days: 7
